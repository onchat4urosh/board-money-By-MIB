<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Money</title>
    <meta name="theme-color" content="#4CAF50">
    
    <!-- Link to external Manifest File required for true PWA installation -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        monopolyGreen: '#4CAF50',
                        monopolyGreenDark: '#388E3C'
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-gray-900 dark:text-gray-100 font-sans transition-colors duration-200">

    <div class="max-w-md mx-auto min-h-screen flex flex-col shadow-2xl bg-white dark:bg-gray-800 relative overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-monopolyGreen text-white px-4 py-3 flex items-center justify-between shadow-md shrink-0">
            <div class="flex items-center gap-3">
                <button id="backBtn" class="hidden text-xl focus:outline-none"><i class="fas fa-arrow-left"></i></button>
                <button id="closeTxBtn" class="hidden text-xl focus:outline-none"><i class="fas fa-times"></i></button>
                <h1 id="appTitle" class="text-xl font-semibold tracking-wide">Board Money</h1>
            </div>
            <div class="flex items-center gap-4 text-lg">
                <button id="navAddPlayerBtn" class="hidden focus:outline-none" title="Add Quick Player"><i class="fas fa-user-plus"></i></button>
                <button id="navRemovePlayerBtn" class="hidden focus:outline-none" title="Remove Quick Player"><i class="fas fa-user-minus"></i></button>
                <button id="settingsBtn" class="focus:outline-none" title="Settings"><i class="fas fa-cog"></i></button>
            </div>
        </header>

        <!-- SUB-HEADER TABS -->
        <div id="subTabs" class="flex border-b border-gray-200 dark:border-gray-700 bg-white dark:bg-gray-800 text-sm font-medium shrink-0">
            <button id="tabTransactions" class="w-1/2 py-3 text-center text-monopolyGreen border-b-2 border-monopolyGreen uppercase tracking-wider font-bold flex items-center justify-center gap-2">
                <i class="fas fa-list"></i> Transactions
            </button>
            <button id="tabBalances" class="w-1/2 py-3 text-center text-gray-500 dark:text-gray-400 uppercase tracking-wider font-bold flex items-center justify-center gap-2">
                <i class="fas fa-volume-up"></i> Balances
            </button>
        </div>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-1 overflow-y-auto p-4 unique-page-container">
            
            <!-- IN-APP PWA INSTALL PROMPT BANNER -->
            <div id="pwaInstallBanner" class="hidden mb-4 p-3 bg-green-50 dark:bg-green-950/40 border border-green-200 dark:border-green-900 rounded-xl flex items-center justify-between shadow-sm animate-bounce">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-monopolyGreen flex items-center justify-center text-white text-sm"><i class="fas fa-mobile-alt"></i></div>
                    <div class="text-xs">
                        <p class="font-bold">Install Board Money</p>
                        <p class="text-gray-500 dark:text-gray-400">Run fullscreen like an app!</p>
                    </div>
                </div>
                <button id="btnPwaInstall" class="bg-monopolyGreen hover:bg-monopolyGreenDark text-white text-xs font-bold uppercase tracking-wider px-3 py-1.5 rounded shadow">Install</button>
            </div>
            
            <!-- VIEW 1: SETUP GAME -->
            <section id="viewSetup" class="space-y-6">
                <div>
                    <h2 class="text-gray-700 dark:text-gray-300 font-bold uppercase tracking-wider text-sm mb-3 flex items-center gap-2">
                        <i class="fas fa-users text-gray-500"></i> Players
                    </h2>
                    <div id="setupPlayersList" class="flex flex-wrap gap-2 items-center">
                        <button onclick="openAddPlayerModal()" class="bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 px-3 py-1.5 rounded-full text-sm font-medium shadow-sm border border-gray-300 dark:border-gray-600 flex items-center gap-1.5 transition">
                            <i class="fas fa-plus text-xs"></i> Create
                        </button>
                    </div>
                </div>

                <div>
                    <h2 class="text-gray-700 dark:text-gray-300 font-bold uppercase tracking-wider text-sm mb-3 flex items-center gap-2">
                        <i class="fas fa-cog text-gray-500"></i> Rules
                    </h2>
                    <div class="space-y-4">
                        <div class="flex items-center gap-6">
                            <label class="inline-flex items-center cursor-pointer select-none">
                                <input type="checkbox" id="ruleInfiniteBank" checked class="w-4 h-4 text-monopolyGreen border-gray-300 rounded focus:ring-monopolyGreen accent-monopolyGreen">
                                <span class="ml-2 text-sm text-gray-800 dark:text-gray-200">Infinite bank money</span>
                            </label>
                            <label class="inline-flex items-center cursor-pointer select-none">
                                <input type="checkbox" id="ruleFreeParking" checked class="w-4 h-4 text-monopolyGreen border-gray-300 rounded focus:ring-monopolyGreen accent-monopolyGreen">
                                <span class="ml-2 text-sm text-gray-800 dark:text-gray-200"><span class="bg-blue-600 text-white font-bold px-1 rounded text-xs mr-0.5">P</span> Free parking</span>
                            </label>
                        </div>

                        <div class="relative border border-monopolyGreen dark:border-green-600 rounded p-2 focus-within:ring-1 focus-within:ring-monopolyGreen">
                            <label class="absolute -top-2 left-2 bg-white dark:bg-gray-800 px-1 text-xs text-monopolyGreen font-medium">Starting money</label>
                            <input type="number" id="inputStartingMoney" value="1500" class="w-full bg-transparent border-none outline-none focus:ring-0 text-base py-1">
                        </div>

                        <div class="relative border border-monopolyGreen dark:border-green-600 rounded p-2 focus-within:ring-1 focus-within:ring-monopolyGreen">
                            <label class="absolute -top-2 left-2 bg-white dark:bg-gray-800 px-1 text-xs text-monopolyGreen font-medium">Passing GO money</label>
                            <input type="number" id="inputGoMoney" value="200" class="w-full bg-transparent border-none outline-none focus:ring-0 text-base py-1">
                        </div>

                        <div class="relative border border-monopolyGreen dark:border-green-600 rounded p-2 focus-within:ring-1 focus-within:ring-monopolyGreen">
                            <label class="absolute -top-2 left-2 bg-white dark:bg-gray-800 px-1 text-xs text-monopolyGreen font-medium">Currency</label>
                            <select id="inputCurrency" class="w-full bg-transparent border-none outline-none focus:ring-0 text-base py-1 appearance-none cursor-pointer">
                                <option value="$">$</option>
                                <option value="₹">₹</option>
                                <option value="€">€</option>
                                <option value="£">£</option>
                                <option value="AED">AED</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-700 dark:text-gray-300">
                                <i class="fas fa-caret-down"></i>
                            </div>
                        </div>

                        <button id="btnPlayNow" class="w-fit bg-monopolyGreen hover:bg-monopolyGreenDark text-white font-bold uppercase tracking-wider text-sm px-6 py-2.5 rounded shadow-md transition transform active:scale-95">
                            Play Now
                        </button>
                    </div>
                </div>
            </section>

            <!-- VIEW 2: ACTIVE DASHBOARD GRID -->
            <section id="viewDashboard" class="hidden">
                <div id="gridAccounts" class="grid grid-cols-2 gap-3"></div>
            </section>

            <!-- VIEW 3: TRANSACTION LOGS -->
            <section id="viewTransactions" class="hidden space-y-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                        <i class="fas fa-search"></i>
                    </span>
                    <input type="text" id="txSearch" placeholder="Search transactions..." class="w-full pl-9 pr-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-gray-50 dark:bg-gray-700 focus:ring-monopolyGreen focus:border-monopolyGreen">
                </div>
                <div id="txLogList" class="space-y-2 max-h-[60vh] overflow-y-auto"></div>
            </section>

            <!-- VIEW 4: SYSTEM ENGINE SETTINGS -->
            <section id="viewSettings" class="hidden space-y-6">
                <div>
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Display Mode</h3>
                    <button id="toggleDarkMode" class="w-full flex items-center justify-between p-3 bg-gray-100 dark:bg-gray-700 rounded-lg font-medium transition">
                        <span>Dark Theme</span>
                        <i id="darkModeIcon" class="fas fa-moon text-lg text-gray-600 dark:text-yellow-400"></i>
                    </button>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Data Operations</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <button onclick="exportGameData()" class="p-3 bg-blue-500 text-white rounded-lg font-medium shadow flex flex-col items-center justify-center gap-1 hover:bg-blue-600"><i class="fas fa-download"></i> Export JSON</button>
                        <label class="p-3 bg-purple-500 text-white rounded-lg font-medium shadow flex flex-col items-center justify-center gap-1 hover:bg-purple-600 text-center cursor-pointer">
                            <i class="fas fa-upload"></i> Import JSON
                            <input type="file" id="importFile" class="hidden" accept=".json" onchange="importGameData(event)">
                        </label>
                    </div>
                </div>
                <div>
                    <h3 class="text-sm font-bold text-red-500 uppercase tracking-wider mb-2">Danger Zone</h3>
                    <button id="btnResetGame" class="w-full p-3 bg-red-600 text-white rounded-lg font-bold shadow hover:bg-red-700 transition">
                        <i class="fas fa-trash-alt mr-1"></i> Reset Core Game
                    </button>
                </div>
            </section>
        </main>

        <!-- TRANSACTION KEYPAD BOTTOM OVERLAY MODAL SHEET -->
        <div id="modalTransfer" class="fixed inset-0 bg-black/50 z-50 flex flex-col justify-end transition-opacity duration-300 opacity-0 pointer-events-none">
            <div class="bg-white dark:bg-gray-800 rounded-t-2xl max-w-md mx-auto w-full p-4 transform translate-y-full transition-transform duration-300 shadow-xl flex flex-col max-h-[85vh]">
                <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-2">
                    <h3 class="text-lg font-bold tracking-wide">Transfer money</h3>
                    <button id="closeTransferModal" class="text-gray-500 text-xl"><i class="fas fa-times"></i></button>
                </div>
                
                <div class="flex items-center justify-center gap-4 my-4">
                    <div id="srcNode" class="w-28 p-3 rounded text-center text-white font-bold shadow relative">
                        <span id="srcNodeName">---</span>
                        <div id="srcNodeVal" class="text-xs font-normal opacity-90 mt-1">0</div>
                    </div>
                    <div class="text-monopolyGreen text-xl animate-pulse"><i class="fas fa-arrow-right"></i></div>
                    <div id="destNode" class="w-28 p-3 rounded text-center text-white font-bold shadow relative">
                        <span id="destNodeName">---</span>
                        <div id="destNodeVal" class="text-xs font-normal opacity-90 mt-1">0</div>
                    </div>
                </div>

                <div class="text-center text-3xl font-extrabold my-2 flex items-center justify-center gap-1">
                    <span id="keypadValueDisplay">0</span><span class="currencySymbol">$</span>
                </div>

                <div class="grid grid-cols-3 gap-2 my-2 text-xl font-bold text-gray-800 dark:text-gray-100 flex-1">
                    <button class="keypad-btn p-3 bg-gray-50 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="M">M</button>
                    <button class="keypad-btn p-3 bg-gray-50 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="000">000</button>
                    <button class="keypad-btn p-3 bg-gray-50 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="K">K</button>
                    
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="7">7</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="8">8</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="9">9</button>
                    
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="4">4</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="5">5</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="6">6</button>
                    
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="1">1</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="2">2</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="3">3</button>
                    
                    <button class="keypad-btn p-3 bg-gray-50 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val=".">.</button>
                    <button class="keypad-btn p-3 bg-gray-100 dark:bg-gray-700 rounded active:bg-gray-200 dark:active:bg-gray-600" data-val="0">0</button>
                    <button class="keypad-btn p-3 bg-red-100 dark:bg-red-900/40 text-red-600 dark:text-red-400 rounded active:bg-red-200" data-val="DEL">DEL</button>
                </div>

                <button id="btnExecuteTransfer" class="w-full py-3 mt-2 bg-monopolyGreen hover:bg-monopolyGreenDark text-white font-bold rounded shadow uppercase tracking-wider text-base">
                    Transfer
                </button>
            </div>
        </div>

        <!-- REUSABLE POPUP MODAL: ADD PLAYER -->
        <div id="modalAddPlayer" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-white dark:bg-gray-800 rounded-xl w-full max-w-sm p-5 space-y-4 shadow-2xl">
                <h3 class="text-lg font-bold">Add New Player</h3>
                <input type="text" id="newPlayerName" placeholder="Enter full name" class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-lg bg-transparent focus:ring-2 focus:ring-monopolyGreen outline-none">
                <div>
                    <label class="block text-sm font-semibold mb-1 text-gray-500">Pick Dashboard Tile Swatch</label>
                    <div class="flex gap-2 justify-between" id="colorPickerContainer"></div>
                </div>
                <div class="flex justify-end gap-2 text-sm font-bold pt-2">
                    <button onclick="closeAddPlayerModal()" class="px-4 py-2 text-gray-500 uppercase">Cancel</button>
                    <button onclick="submitAddPlayer()" class="px-4 py-2 bg-monopolyGreen text-white rounded uppercase shadow">Save</button>
                </div>
            </div>
        </div>

    </div>

    <!-- MAIN APP JAVASCRIPT ENGINE -->
    <script>
        const THEME_COLORS = [
            { name: 'Red', hex: '#EF4444' },
            { name: 'Blue', hex: '#3B82F6' },
            { name: 'Pink', hex: '#EC4899' },
            { name: 'Purple', hex: '#8B5CF6' },
            { name: 'Amber', hex: '#F59E0B' },
            { name: 'Teal', hex: '#14B8A6' }
        ];

        let gameState = {
            isPlaying: false,
            currency: '$',
            startingMoney: 1500,
            goSalary: 200,
            infiniteBank: true,
            useFreeParking: true,
            players: [
                { id: 'p1', name: 'Annette', color: '#EF4444', balance: 1500, isBankrupt: false },
                { id: 'p2', name: 'Clara', color: '#4CAF50', balance: 1500, isBankrupt: false },
                { id: 'p3', name: 'Jens', color: '#3B82F6', balance: 1500, isBankrupt: false },
                { id: 'p4', name: 'Niklas', color: '#1D4ED8', balance: 1500, isBankrupt: false }
            ],
            bankBalance: 50000,
            freeParkingBalance: 0,
            transactions: []
        };

        let selectedColorHex = THEME_COLORS[0].hex;
        let currentTransferSrc = null; 
        let currentTransferDest = null;
        let keypadString = '0';
        let currentActiveTab = 'balances';
        let deferredPrompt = null; // Intercept Native Chrome Install Routine

        window.addEventListener('DOMContentLoaded', () => {
            loadStateFromStorage();
            initPWARegistration();
            renderColorPickers();
            syncThemeModeStyle();
            applyStateToDOM();
            attachKeypadListeners();
            setupPWAInstallInteractivity();
        });

        // intercept native browser install prompts
        function setupPWAInstallInteractivity() {
            const banner = document.getElementById('pwaInstallBanner');
            const btn = document.getElementById('btnPwaInstall');

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                banner.classList.remove('hidden'); 
            });

            btn.addEventListener('click', async () => {
                if (!deferredPrompt) return;
                banner.classList.add('hidden');
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User responsive intent feedback outcome: ${outcome}`);
                deferredPrompt = null;
            });

            window.addEventListener('appinstalled', () => {
                banner.classList.add('hidden');
                deferredPrompt = null;
                console.log('App successfully initialized in device shell.');
            });
        }

        function saveStateToStorage() {
            localStorage.setItem('BOARD_MONEY_ENGINE_DATA', JSON.stringify(gameState));
        }

        function loadStateFromStorage() {
            const raw = localStorage.getItem('BOARD_MONEY_ENGINE_DATA');
            if (raw) {
                try { gameState = JSON.parse(raw); } catch(e) { console.error("Corrupted local data tree.", e); }
            }
            if(localStorage.getItem('DARK_MODE_ACTIVE') === 'true') {
                document.documentElement.classList.add('dark');
            }
        }

        function syncThemeModeStyle() {
            const isDark = document.documentElement.classList.contains('dark');
            const icon = document.getElementById('darkModeIcon');
            icon.className = isDark ? "fas fa-sun text-lg text-yellow-400" : "fas fa-moon text-lg text-gray-600";
        }

        document.getElementById('toggleDarkMode').addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('DARK_MODE_ACTIVE', document.documentElement.classList.contains('dark'));
            syncThemeModeStyle();
        });

        function renderColorPickers() {
            const container = document.getElementById('colorPickerContainer');
            container.innerHTML = THEME_COLORS.map(c => `
                <button type="button" onclick="selectColor('${c.hex}', this)" class="w-8 h-8 rounded-full border-2 border-transparent transition transform active:scale-95 spec-color-dot" style="background-color: ${c.hex};" title="${c.name}"></button>
            `).join('');
            const targets = container.querySelectorAll('.spec-color-dot');
            if(targets.length > 0) selectColor(THEME_COLORS[0].hex, targets[0]);
        }

        function selectColor(hex, element) {
            selectedColorHex = hex;
            document.querySelectorAll('.spec-color-dot').forEach(el => el.classList.remove('border-black', 'dark:border-white', 'scale-110'));
            if(element) element.classList.add('border-black', 'dark:border-white', 'scale-110');
        }

        function applyStateToDOM() {
            document.getElementById('ruleInfiniteBank').checked = gameState.infiniteBank;
            document.getElementById('ruleFreeParking').checked = gameState.useFreeParking;
            document.getElementById('inputStartingMoney').value = gameState.startingMoney;
            document.getElementById('inputGoMoney').value = gameState.goSalary;
            document.getElementById('inputCurrency').value = gameState.currency;

            document.querySelectorAll('.currencySymbol').forEach(el => el.innerText = gameState.currency);

            const tagsWrapper = document.getElementById('setupPlayersList');
            tagsWrapper.querySelectorAll('.player-tag-node').forEach(n => n.remove());
            
            gameState.players.forEach(p => {
                const span = document.createElement('div');
                span.className = `player-tag-node flex items-center gap-1.5 px-3 py-1.5 rounded-full text-sm font-semibold shadow-sm text-white relative group`;
                span.style.backgroundColor = p.color;
                span.innerHTML = `
                    <span class="w-2 h-2 rounded-full bg-white block"></span>
                    <span>${p.name}</span>
                    <button onclick="removePlayer('${p.id}')" class="hover:text-black focus:outline-none ml-1 text-xs opacity-80 hover:opacity-100"><i class="fas fa-times"></i></button>
                `;
                tagsWrapper.insertBefore(span, tagsWrapper.firstChild);
            });

            if (!gameState.isPlaying) {
                showSetupScreen();
            } else {
                showDashboardScreen();
            }
        }

        function showSetupScreen() {
            document.getElementById('viewSetup').classList.remove('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');
            document.getElementById('viewTransactions').classList.add('hidden');
            document.getElementById('viewSettings').classList.add('hidden');
            document.getElementById('subTabs').classList.add('hidden');
            
            document.getElementById('backBtn').classList.add('hidden');
            document.getElementById('closeTxBtn').classList.add('hidden');
            document.getElementById('navAddPlayerBtn').classList.add('hidden');
            document.getElementById('navRemovePlayerBtn').classList.add('hidden');
            document.getElementById('settingsBtn').classList.remove('hidden');
            document.getElementById('appTitle').innerText = "Board Money";
        }

        function showDashboardScreen() {
            document.getElementById('viewSetup').classList.add('hidden');
            document.getElementById('viewSettings').classList.add('hidden');
            document.getElementById('subTabs').classList.remove('hidden');
            document.getElementById('settingsBtn').classList.remove('hidden');
            document.getElementById('closeTxBtn').classList.add('hidden');
            document.getElementById('navAddPlayerBtn').classList.remove('hidden');
            document.getElementById('navRemovePlayerBtn').classList.remove('hidden');

            if(currentActiveTab === 'balances') {
                document.getElementById('viewDashboard').classList.remove('hidden');
                document.getElementById('viewTransactions').classList.add('hidden');
                document.getElementById('backBtn').classList.add('hidden');
                document.getElementById('appTitle').innerText = "Board Money";
                renderDashboardAccounts();
                document.getElementById('tabBalances').className = "w-1/2 py-3 text-center text-monopolyGreen border-b-2 border-monopolyGreen uppercase tracking-wider font-bold flex items-center justify-center gap-2";
                document.getElementById('tabTransactions').className = "w-1/2 py-3 text-center text-gray-500 dark:text-gray-400 uppercase tracking-wider font-bold flex items-center justify-center gap-2";
            } else {
                document.getElementById('viewDashboard').classList.add('hidden');
                document.getElementById('viewTransactions').classList.remove('hidden');
                document.getElementById('backBtn').classList.add('hidden');
                document.getElementById('appTitle').innerText = "Transactions";
                renderTransactionsList();
                document.getElementById('tabTransactions').className = "w-1/2 py-3 text-center text-monopolyGreen border-b-2 border-monopolyGreen uppercase tracking-wider font-bold flex items-center justify-center gap-2";
                document.getElementById('tabBalances').className = "w-1/2 py-3 text-center text-gray-500 dark:text-gray-400 uppercase tracking-wider font-bold flex items-center justify-center gap-2";
            }
        }

        function renderDashboardAccounts() {
            const container = document.getElementById('gridAccounts');
            container.innerHTML = '';

            const bankCard = document.createElement('div');
            bankCard.className = `p-4 rounded-lg text-center shadow-md select-none cursor-pointer flex flex-col justify-between h-40 transition transform active:scale-95 bg-gray-400 text-white`;
            bankCard.innerHTML = `
                <div class="font-bold tracking-wide flex items-center justify-center gap-1.5 text-sm uppercase"><i class="fas fa-university"></i> Bank</div>
                <div class="text-4xl my-auto font-black tracking-widest">${gameState.infiniteBank ? '∞' : formatCurrencyValue(gameState.bankBalance)}</div>
                <div class="text-xs bg-black/10 py-1 rounded select-none opacity-0">Placeholder</div>
            `;
            bankCard.addEventListener('click', () => handleAccountTileClick('bank'));
            container.appendChild(bankCard);

            if (gameState.useFreeParking) {
                const fpCard = document.createElement('div');
                fpCard.className = `p-4 rounded-lg text-center shadow-md select-none cursor-pointer flex flex-col justify-between h-40 transition transform active:scale-95 bg-monopolyGreen text-white`;
                fpCard.innerHTML = `
                    <div class="font-bold tracking-wide flex items-center justify-center gap-1.5 text-sm uppercase"><i class="fas fa-parking"></i> Free parking</div>
                    <div class="text-3xl my-auto font-black">${formatCurrencyValue(gameState.freeParkingBalance)}</div>
                    <button onclick="event.stopPropagation(); distributeFreeParkingToBank();" class="text-[10px] uppercase font-bold border border-white/50 bg-white/10 hover:bg-white/20 px-2 py-0.5 rounded transition">Clear to Bank</button>
                `;
                fpCard.addEventListener('click', () => handleAccountTileClick('parking'));
                container.appendChild(fpCard);
            }

            gameState.players.forEach(p => {
                const backgroundStyle = p.isBankrupt ? 'bg-gray-300 dark:bg-gray-700 opacity-40 line-through text-gray-500' : 'text-white';
                const pCard = document.createElement('div');
                pCard.className = `p-4 rounded-lg text-center shadow-md select-none cursor-pointer flex flex-col justify-between h-40 transition transform relative active:scale-95 ${backgroundStyle}`;
                if(!p.isBankrupt) pCard.style.backgroundColor = p.color;

                pCard.innerHTML = `
                    <div class="font-bold tracking-wide text-sm truncate uppercase px-1">${p.name}</div>
                    <div class="text-3xl my-auto font-black truncate">${p.isBankrupt ? 'BANKRUPT' : formatCurrencyValue(p.balance)}</div>
                    <div class="flex gap-1 justify-center items-center">
                        <button onclick="event.stopPropagation(); executeGoSalaryBonus('${p.id}');" ${p.isBankrupt ? 'disabled' : ''} class="text-[10px] uppercase font-bold border border-white/40 bg-white/10 hover:bg-white/25 px-2 py-1 rounded transition">Passed over GO</button>
                        <button onclick="event.stopPropagation(); toggleBankruptStatus('${p.id}');" class="text-[10px] uppercase font-bold border border-white/40 bg-black/10 hover:bg-black/25 p-1 rounded transition" title="Toggle Bankrupt"><i class="fas fa-skull"></i></button>
                    </div>
                `;
                pCard.addEventListener('click', () => { if(!p.isBankrupt) handleAccountTileClick(p.id); });
                container.appendChild(pCard);
            });
        }

        function formatCurrencyValue(val) {
            return Number(val).toLocaleString() + ' ' + gameState.currency;
        }

        document.getElementById('tabTransactions').addEventListener('click', () => { currentActiveTab = 'transactions'; showDashboardScreen(); });
        document.getElementById('tabBalances').addEventListener('click', () => { currentActiveTab = 'balances'; showDashboardScreen(); });
        
        document.getElementById('settingsBtn').addEventListener('click', () => {
            document.getElementById('viewSetup').classList.add('hidden');
            document.getElementById('viewDashboard').classList.add('hidden');
            document.getElementById('viewTransactions').classList.add('hidden');
            document.getElementById('subTabs').classList.add('hidden');
            document.getElementById('viewSettings').classList.remove('hidden');
            document.getElementById('settingsBtn').classList.add('hidden');
            document.getElementById('navAddPlayerBtn').classList.add('hidden');
            document.getElementById('navRemovePlayerBtn').classList.add('hidden');
            document.getElementById('backBtn').classList.remove('hidden');
            document.getElementById('appTitle').innerText = "Settings";
        });

        document.getElementById('backBtn').addEventListener('click', () => { showDashboardScreen(); });

        document.getElementById('btnPlayNow').addEventListener('click', () => {
            if(gameState.players.length < 1) return alert("Please build at least 1 player profile.");
            gameState.infiniteBank = document.getElementById('ruleInfiniteBank').checked;
            gameState.useFreeParking = document.getElementById('ruleFreeParking').checked;
            gameState.startingMoney = parseFloat(document.getElementById('inputStartingMoney').value) || 1500;
            gameState.goSalary = parseFloat(document.getElementById('inputGoMoney').value) || 200;
            gameState.currency = document.getElementById('inputCurrency').value;
            
            if(!gameState.isPlaying) {
                gameState.players.forEach(p => p.balance = gameState.startingMoney);
                gameState.isPlaying = true;
            }
            saveStateToStorage();
            applyStateToDOM();
        });

        document.getElementById('navAddPlayerBtn').addEventListener('click', () => openAddPlayerModal());
        document.getElementById('navRemovePlayerBtn').addEventListener('click', () => {
            if(gameState.players.length === 0) return;
            const target = gameState.players[gameState.players.length - 1];
            if(confirm(`Remove player ${target.name}?`)) removePlayer(target.id);
        });

        function openAddPlayerModal() { document.getElementById('modalAddPlayer').classList.remove('hidden'); }
        function closeAddPlayerModal() { document.getElementById('modalAddPlayer').classList.add('hidden'); }
        
        function submitAddPlayer() {
            const nameIn = document.getElementById('newPlayerName').value.trim();
            if(!nameIn) return alert("Valid name target payload string structural length mandatory.");
            
            const newPlayer = {
                id: 'p_' + Date.now(),
                name: nameIn,
                color: selectedColorHex,
                balance: gameState.startingMoney,
                isBankrupt: false
            };
            gameState.players.push(newPlayer);
            document.getElementById('newPlayerName').value = '';
            closeAddPlayerModal();
            saveStateToStorage();
            applyStateToDOM();
        }

        function removePlayer(id) {
            gameState.players = gameState.players.filter(p => p.id !== id);
            saveStateToStorage();
            applyStateToDOM();
        }

        function toggleBankruptStatus(id) {
            const p = gameState.players.find(x => x.id === id);
            if(p) {
                p.isBankrupt = !p.isBankrupt;
                logEngineTransaction('system', p.id, 0, `Player marked as ${p.isBankrupt ? 'Bankrupt' : 'Active'}`);
                saveStateToStorage();
                renderDashboardAccounts();
            }
        }

        function executeGoSalaryBonus(id) {
            const p = gameState.players.find(x => x.id === id);
            if(p) {
                p.balance += gameState.goSalary;
                if(!gameState.infiniteBank) gameState.bankBalance -= gameState.goSalary;
                logEngineTransaction('bank', p.id, gameState.goSalary, "Passed over GO salary bonus");
                saveStateToStorage();
                renderDashboardAccounts();
            }
        }

        function distributeFreeParkingToBank() {
            if(gameState.freeParkingBalance === 0) return;
            const originalAmt = gameState.freeParkingBalance;
            if(!gameState.infiniteBank) gameState.bankBalance += originalAmt;
            gameState.freeParkingBalance = 0;
            logEngineTransaction('parking', 'bank', originalAmt, "Cleared internal Free Parking structural cache down into Bank assets");
            saveStateToStorage();
            renderDashboardAccounts();
        }

        function handleAccountTileClick(id) {
            if (currentTransferSrc === null) {
                currentTransferSrc = id;
                highlightTileSelectionAsSource(id);
            } else if (currentTransferSrc === id) {
                resetTransferStatePointers();
            } else {
                currentTransferDest = id;
                openKeypadModalSheet();
            }
        }

        function highlightTileSelectionAsSource(id) {
            document.getElementById('appTitle').innerText = "Select Target Recipient...";
            document.getElementById('settingsBtn').classList.add('hidden');
            document.getElementById('navAddPlayerBtn').classList.add('hidden');
            document.getElementById('navRemovePlayerBtn').classList.add('hidden');
            document.getElementById('closeTxBtn').classList.remove('hidden');
        }

        document.getElementById('closeTxBtn').addEventListener('click', () => resetTransferStatePointers());

        function resetTransferStatePointers() {
            currentTransferSrc = null;
            currentTransferDest = null;
            keypadString = '0';
            showDashboardScreen();
        }

        function openKeypadModalSheet() {
            const srcObj = getAccountDetailsObject(currentTransferSrc);
            const destObj = getAccountDetailsObject(currentTransferDest);

            document.getElementById('srcNodeName').innerText = srcObj.name;
            document.getElementById('srcNode').style.backgroundColor = srcObj.color;
            document.getElementById('srcNodeVal').innerText = srcObj.balance;

            document.getElementById('destNodeName').innerText = destObj.name;
            document.getElementById('destNode').style.backgroundColor = destObj.color;
            document.getElementById('destNodeVal').innerText = destObj.balance;

            keypadString = '0';
            updateKeypadDisplay();

            const modal = document.getElementById('modalTransfer');
            modal.classList.remove('pointer-events-none');
            modal.classList.add('opacity-100');
            modal.querySelector('.transform').classList.remove('translate-y-full');
        }

        function closeKeypadModalSheet() {
            const modal = document.getElementById('modalTransfer');
            modal.classList.add('pointer-events-none');
            modal.classList.remove('opacity-100');
            modal.querySelector('.transform').classList.add('translate-y-full');
            resetTransferStatePointers();
        }

        document.getElementById('closeTransferModal').addEventListener('click', () => closeKeypadModalSheet());

        function getAccountDetailsObject(id) {
            if (id === 'bank') return { name: 'Bank', color: '#9CA3AF', balance: gameState.infiniteBank ? '∞' : formatCurrencyValue(gameState.bankBalance) };
            if (id === 'parking') return { name: 'Free Parking', color: '#4CAF50', balance: formatCurrencyValue(gameState.freeParkingBalance) };
            const p = gameState.players.find(x => x.id === id);
            return p ? { name: p.name, color: p.color, balance: formatCurrencyValue(p.balance) } : { name: 'Unknown', color: '#000', balance: '0' };
        }

        function attachKeypadListeners() {
            document.querySelectorAll('.keypad-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    processKeypadInput(btn.getAttribute('data-val'));
                });
            });
        }

        function processKeypadInput(val) {
            if (val === 'DEL') {
                keypadString = keypadString.length <= 1 ? '0' : keypadString.slice(0, -1);
            } else if (val === 'K') {
                keypadString = ((parseFloat(keypadString) || 0) * 1000).toString();
            } else if (val === 'M') {
                keypadString = ((parseFloat(keypadString) || 0) * 1000000).toString();
            } else {
                if (keypadString === '0' && val !== '.') {
                    keypadString = val;
                } else {
                    if(val === '.' && keypadString.includes('.')) return;
                    keypadString += val;
                }
            }
            updateKeypadDisplay();
        }

        function updateKeypadDisplay() {
            document.getElementById('keypadValueDisplay').innerText = keypadString;
        }

        document.getElementById('btnExecuteTransfer').addEventListener('click', () => {
            const numericValue = parseFloat(keypadString);
            if (isNaN(numericValue) || numericValue <= 0) return alert("Specify valid numeric transfer amount.");

            if (currentTransferSrc !== 'bank' && currentTransferSrc !== 'parking') {
                const playerSrc = gameState.players.find(x => x.id === currentTransferSrc);
                if (playerSrc && playerSrc.balance < numericValue) {
                    if (!confirm("Overdraft Alert: Source wallet has insufficient funds. Force transfer?")) return;
                }
            }

            if (currentTransferSrc === 'bank') { if (!gameState.infiniteBank) gameState.bankBalance -= numericValue; }
            else if (currentTransferSrc === 'parking') { gameState.freeParkingBalance -= numericValue; }
            else { const p = gameState.players.find(x => x.id === currentTransferSrc); if(p) p.balance -= numericValue; }

            if (currentTransferDest === 'bank') { if (!gameState.infiniteBank) gameState.bankBalance += numericValue; }
            else if (currentTransferDest === 'parking') { gameState.freeParkingBalance += numericValue; }
            else { const p = gameState.players.find(x => x.id === currentTransferDest); if(p) p.balance += numericValue; }

            logEngineTransaction(currentTransferSrc, currentTransferDest, numericValue, "Ledger transfer");
            saveStateToStorage();
            closeKeypadModalSheet();
            renderDashboardAccounts();
        });

        function logEngineTransaction(src, dest, amt, desc) {
            gameState.transactions.unshift({
                id: 'tx_' + Date.now() + Math.random().toString(36).substr(2, 4),
                timestamp: new Date().toLocaleString(),
                source: src,
                destination: dest,
                amount: amt,
                memo: desc
            });
        }

        function renderTransactionsList() {
            const listContainer = document.getElementById('txLogList');
            const searchVal = document.getElementById('txSearch').value.toLowerCase();
            listContainer.innerHTML = '';

            const filtered = gameState.transactions.filter(t => {
                const srcObj = getAccountDetailsObject(t.source);
                const destObj = getAccountDetailsObject(t.destination);
                return srcObj.name.toLowerCase().includes(searchVal) || destObj.name.toLowerCase().includes(searchVal) || t.memo.toLowerCase().includes(searchVal);
            });

            if(filtered.length === 0) {
                listContainer.innerHTML = `<div class="text-center text-gray-400 py-8 text-sm">No transaction ledger records match filtering conditions.</div>`;
                return;
            }

            filtered.forEach(t => {
                const srcObj = getAccountDetailsObject(t.source);
                const destObj = getAccountDetailsObject(t.destination);
                const row = document.createElement('div');
                row.className = "p-3 border border-gray-200 dark:border-gray-700 rounded-xl bg-white dark:bg-gray-800 shadow-sm flex items-center justify-between gap-2 transition";
                row.innerHTML = `
                    <div class="flex items-center gap-3 flex-1 min-w-0">
                        <div class="px-2.5 py-1.5 rounded text-white font-bold text-xs shrink-0 max-w-[70px] truncate" style="background-color: ${srcObj.color}">${srcObj.name}</div>
                        <div class="text-gray-400 shrink-0 text-xs"><i class="fas fa-chevron-right"></i></div>
                        <div class="px-2.5 py-1.5 rounded text-white font-bold text-xs shrink-0 max-w-[70px] truncate" style="background-color: ${destObj.color}">${destObj.name}</div>
                        <div class="flex flex-col min-w-0 ml-1">
                            <span class="text-xs font-bold text-gray-500 truncate">${t.memo}</span>
                            <span class="text-[10px] text-gray-400 truncate">${t.timestamp}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                        <span class="text-sm font-black tracking-wide text-gray-800 dark:text-gray-200">${t.amount > 0 ? formatCurrencyValue(t.amount) : ''}</span>
                        <button onclick="revertLedgerTransactionById('${t.id}')" class="text-xs text-red-500 hover:bg-red-50 dark:hover:bg-red-950/30 px-2 py-1 rounded border border-red-200 dark:border-red-900 font-semibold transition">Undo</button>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        }

        document.getElementById('txSearch').addEventListener('input', () => renderTransactionsList());

        function revertLedgerTransactionById(txId) {
            const idx = gameState.transactions.findIndex(x => x.id === txId);
            if(idx === -1) return;
            const tx = gameState.transactions[idx];

            if(confirm(`Completely revert this transaction?`)) {
                if (tx.destination === 'bank') { if (!gameState.infiniteBank) gameState.bankBalance -= tx.amount; }
                else if (tx.destination === 'parking') { gameState.freeParkingBalance -= tx.amount; }
                else { const p = gameState.players.find(x => x.id === tx.destination); if(p) p.balance -= tx.amount; }

                if (tx.source === 'bank') { if (!gameState.infiniteBank) gameState.bankBalance += tx.amount; }
                else if (tx.source === 'parking') { gameState.freeParkingBalance += tx.amount; }
                else { const p = gameState.players.find(x => x.id === tx.source); if(p) p.balance += tx.amount; }

                gameState.transactions.splice(idx, 1);
                saveStateToStorage();
                renderTransactionsList();
                renderDashboardAccounts();
            }
        }

        document.getElementById('btnResetGame').addEventListener('click', () => {
            if(confirm("Completely reset metrics data logs cache permanently?")) {
                localStorage.removeItem('BOARD_MONEY_ENGINE_DATA');
                gameState.isPlaying = false;
                gameState.transactions = [];
                gameState.freeParkingBalance = 0;
                gameState.bankBalance = 50000;
                gameState.players.forEach(p => { p.balance = gameState.startingMoney; p.isBankrupt = false; });
                saveStateToStorage();
                applyStateToDOM();
                showSetupScreen();
            }
        });

        function exportGameData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(gameState, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `board_money_ledger_${Date.now()}.json`);
            dlAnchorElem.click();
        }

        function importGameData(event) {
            const input = event.target;
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const importedState = JSON.parse(reader.result);
                    if(importedState.players && Array.isArray(importedState.players)) {
                        gameState = importedState;
                        saveStateToStorage();
                        applyStateToDOM();
                        alert("Data profiles updated successfully.");
                    } else { alert("Validation failure schema error."); }
                } catch(e) { alert("Parse failure."); }
            };
            if(input.files[0]) reader.readAsText(input.files[0]);
        }

        // PHYSICAL SEPARATE ASSETS REGISTRATION PATTERN
        function initPWARegistration() {
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js')
                        .then(reg => console.log('ServiceWorker engine core running cleanly.'))
                        .catch(err => console.error('PWA Engine error mapping physical assets.', err));
                });
            }
        }
    </script>
</body>
</html>
